name: build-app
on:
  push:
    branches: ["**"]
    tags: ["**"]
    paths-ignore:
      - ".github/workflows/updater.yml"
      - "updater/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - ".github/workflows/updater.yml"
      - "updater/**"
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: set up go
      uses: actions/setup-go@v7
      with:
        go-version: "1.25"
      id: go

    - name: build and test
      run: |
        go test -v -race -timeout=180s -covermode=atomic -coverprofile=$GITHUB_WORKSPACE/profile.cov_tmp ./...
        go build -race ./...
        cat $GITHUB_WORKSPACE/profile.cov_tmp | grep -v "mocks" | grep -v "_mock" > $GITHUB_WORKSPACE/profile.cov
      env:
        TZ: "America/Chicago"

    # build the example the way someone copying it out of the repository would, against the released
    # tg-spam its go.mod pins
    - name: test examples
      run: |
        go test -race ./...
        go build -race ./...
      working-directory: _examples/simplechat
      env:
        TZ: "America/Chicago"

    # and again against this checkout, otherwise a library change that breaks the example still passes
    # CI. the workspace is created here rather than committed: a relative replace directive would make
    # the example unusable once copied out of the repository.
    - name: test examples against the current checkout
      run: |
        go work init . ../..
        expected=$(cd ../.. && pwd)
        resolved=$(go list -m -f '{{.Dir}}' github.com/umputun/tg-spam)
        if [ "$resolved" != "$expected" ]; then
          echo "expected tg-spam to resolve to $expected, got $resolved"
          exit 1
        fi
        go test -race ./...
        go build -race ./...
      working-directory: _examples/simplechat
      env:
        TZ: "America/Chicago"

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: golangci-lint on example directory
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --config ../../.golangci.yml
        working-directory: _examples/simplechat

    - name: submit coverage
      run: |
        go install github.com/mattn/goveralls@latest
        goveralls -service="github" -coverprofile=$GITHUB_WORKSPACE/profile.cov
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
