# example of a minimal compose file to run tg-spam
# on linux create the data folder before the first start and give it to uid:gid 1000:1000, the user tg-spam
# runs as, otherwise docker creates it owned by root and the bot keeps restarting:
#   mkdir -p var && sudo chown 1000:1000 var
services:
  tg-spam:
    image: ghcr.io/umputun/tg-spam:master # use :latest tag for production
    hostname: tg-spam
    restart: always
    container_name: tg-spam
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - TELEGRAM_TOKEN # should be set in environment or in .env file
      - TELEGRAM_GROUP # should be set in environment or in .env file
    volumes:
      - ./var:/srv/data # mount volume to store persistent data on host's var directory